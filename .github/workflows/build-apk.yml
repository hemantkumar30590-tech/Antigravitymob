name: Build & Release AntigravityWeb APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Signed AntigravityWeb.apk (Zero-Dependency Native SDK Build)
        run: |
          set -e
          mkdir -p /tmp/fast_apk/src/com/antigravity/web
          mkdir -p /tmp/fast_apk/res/values
          mkdir -p /tmp/fast_apk/classes

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)
          PF=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -n 1)

          cat << 'EOF' > /tmp/fast_apk/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Antigravity Web</string>
          </resources>
          EOF

          cat << 'EOF' > /tmp/fast_apk/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.antigravity.web.onmob"
              android:versionCode="1"
              android:versionName="1.0.0">

              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name="com.antigravity.web.MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > /tmp/fast_apk/src/com/antigravity/web/MainActivity.java
          package com.antigravity.web;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.Inet4Address;
          import java.net.InetAddress;
          import java.net.InetSocketAddress;
          import java.net.NetworkInterface;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;
              private PowerManager.WakeLock wakeLock;
              private volatile boolean proxyRunning = true;
              private static final int PROXY_PORT = 4400;
              private static final int TARGET_PORT = 1235;
              private static final String CSRF_HEADER = "x-agaqkz8vmwnqfj_9qx";
              private static final String DEFAULT_TOKEN = "907c52b4-6603-48d9-a40f-a2d710697713";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  acquireWakeLock();
                  startLocalGatewayProxy();

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#070B14"));

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setPadding(24, 16, 24, 16);
                  topBar.setBackgroundColor(Color.parseColor("#0F1626"));

                  TextView title = new TextView(this);
                  title.setText("⚡ Antigravity Web :4400");
                  title.setTextColor(Color.parseColor("#00E5FF"));
                  title.setTextSize(14f);
                  title.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  topBar.addView(title, titleParams);

                  Button copyCmdBtn = new Button(this);
                  copyCmdBtn.setText("Copy npx");
                  copyCmdBtn.setOnClickListener(v -> {
                      ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cb.setPrimaryClip(ClipData.newPlainText("npx", "npx github:hemantkumar30590-tech/Antigravityweb-onmob"));
                      Toast.makeText(this, "Copied: npx github:hemantkumar30590-tech/Antigravityweb-onmob", Toast.LENGTH_SHORT).show();
                  });
                  topBar.addView(copyCmdBtn);

                  Button browserBtn = new Button(this);
                  browserBtn.setText("Browser");
                  browserBtn.setOnClickListener(v -> {
                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("http://localhost:" + PROXY_PORT)));
                      } catch (Exception ignored) {}
                  });
                  topBar.addView(browserBtn);

                  Button reloadBtn = new Button(this);
                  reloadBtn.setText("Reload");
                  reloadBtn.setOnClickListener(v -> loadGatewayUrl());
                  topBar.addView(reloadBtn);

                  root.addView(topBar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  webView = new WebView(this);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setCacheMode(WebSettings.LOAD_NO_CACHE);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Map<String, String> headers = new HashMap<>();
                          headers.put("x-codeium-csrf-token", DEFAULT_TOKEN);
                          headers.put(CSRF_HEADER, DEFAULT_TOKEN);
                          view.loadUrl(request.getUrl().toString(), headers);
                          return true;
                      }
                  });

                  root.addView(webView, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  setContentView(root);
                  root.postDelayed(this::loadGatewayUrl, 300);
              }

              private void loadGatewayUrl() {
                  Map<String, String> headers = new HashMap<>();
                  headers.put("x-codeium-csrf-token", DEFAULT_TOKEN);
                  headers.put(CSRF_HEADER, DEFAULT_TOKEN);
                  webView.loadUrl("http://127.0.0.1:" + PROXY_PORT, headers);
              }

              private void acquireWakeLock() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "AntigravityWeb::WakeLock");
                      wakeLock.acquire(4 * 60 * 60 * 1000L);
                  } catch (Exception ignored) {}
              }

              private String getLanIp() {
                  try {
                      for (NetworkInterface nif : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!nif.isUp() || nif.isLoopback()) continue;
                          for (InetAddress addr : Collections.list(nif.getInetAddresses())) {
                              if (addr instanceof Inet4Address && !addr.isLoopbackAddress()) {
                                  return addr.getHostAddress();
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return "127.0.0.1";
              }

              private void startLocalGatewayProxy() {
                  new Thread(() -> {
                      try (ServerSocket server = new ServerSocket()) {
                          server.setReuseAddress(true);
                          server.bind(new InetSocketAddress("0.0.0.0", PROXY_PORT));
                          while (proxyRunning) {
                              Socket client = server.accept();
                              new Thread(() -> handleClient(client)).start();
                          }
                      } catch (Exception ignored) {}
                  }).start();
              }

              private void handleClient(Socket client) {
                  try (Socket c = client) {
                      InputStream in = c.getInputStream();
                      OutputStream out = c.getOutputStream();
                      try (Socket backend = new Socket()) {
                          backend.connect(new InetSocketAddress("127.0.0.1", TARGET_PORT), 1200);
                          OutputStream bOut = backend.getOutputStream();
                          InputStream bIn = backend.getInputStream();
                          Thread t1 = new Thread(() -> pipe(in, bOut));
                          Thread t2 = new Thread(() -> pipe(bIn, out));
                          t1.start();
                          t2.start();
                          t1.join();
                          t2.join();
                      } catch (Exception e) {
                          String lanIp = getLanIp();
                          String html = "<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'>"
                              + "<style>body{background:#070B14;color:#F0F4FF;font-family:sans-serif;padding:20px;margin:0;}"
                              + ".card{background:#0F1626;border:1px solid #263554;border-radius:14px;padding:16px;margin-top:14px;}"
                              + ".badge{display:inline-block;background:rgba(0,230,118,0.15);color:#00E676;border:1px solid #00E676;padding:4px 10px;border-radius:99px;font-size:12px;font-family:monospace;}"
                              + "code{display:block;background:#050811;color:#00E5FF;padding:12px;border-radius:8px;margin-top:8px;font-family:monospace;word-break:break-all;}"
                              + "h2{color:#00E5FF;margin:10px 0 6px 0;}</style></head><body>"
                              + "<span class='badge'>GATEWAY ACTIVE :4400</span>"
                              + "<h2>🚀 Antigravityweb-onmob</h2>"
                              + "<p style='color:#94A3B8;font-size:14px;'>CSRF Header Bridge (<b>" + CSRF_HEADER + "</b>) & Wake-Lock active.</p>"
                              + "<div class='card'><b>📱 Mobile URL:</b><code>http://localhost:4400</code>"
                              + "<b style='display:block;margin-top:10px;'>💻 PC / Laptop Wi-Fi URL:</b><code>http://" + lanIp + ":4400</code></div>"
                              + "<div class='card'><b>⚡ Start Antigravity Backend (:1235) in Termux:</b>"
                              + "<code>npx github:hemantkumar30590-tech/Antigravityweb-onmob</code>"
                              + "<p style='color:#94A3B8;font-size:13px;margin-top:8px;'>Jaise hi Termux me backend (:1235) start hoga, upar <b>Reload</b> dabayein!</p></div>"
                              + "</body></html>";
                          byte[] body = html.getBytes("UTF-8");
                          String resp = "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nCache-Control: no-cache\r\nx-codeium-csrf-token: " + DEFAULT_TOKEN + "\r\n" + CSRF_HEADER + ": " + DEFAULT_TOKEN + "\r\nContent-Length: " + body.length + "\r\nConnection: close\r\n\r\n";
                          out.write(resp.getBytes("UTF-8"));
                          out.write(body);
                          out.flush();
                      }
                  } catch (Exception ignored) {}
              }

              private void pipe(InputStream in, OutputStream out) {
                  try {
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          out.write(buf, 0, n);
                          out.flush();
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

          "$BT/aapt2" compile /tmp/fast_apk/res/values/strings.xml -o /tmp/fast_apk/
          "$BT/aapt2" link -o /tmp/fast_apk/unsigned.apk \
              -I "$PF/android.jar" \
              --manifest /tmp/fast_apk/AndroidManifest.xml \
              --java /tmp/fast_apk/src \
              /tmp/fast_apk/values_strings.arsc.flat

          javac --release 11 -cp "$PF/android.jar" -d /tmp/fast_apk/classes \
              /tmp/fast_apk/src/com/antigravity/web/MainActivity.java \
              /tmp/fast_apk/src/com/antigravity/web/onmob/R.java

          "$BT/d8" --lib "$PF/android.jar" --output /tmp/fast_apk/ /tmp/fast_apk/classes/com/antigravity/web/*.class /tmp/fast_apk/classes/com/antigravity/web/onmob/*.class
          (cd /tmp/fast_apk && zip -q unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 /tmp/fast_apk/unsigned.apk /tmp/fast_apk/aligned.apk

          keytool -genkeypair -v -keystore /tmp/fast_apk/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
          "$BT/apksigner" sign --ks /tmp/fast_apk/debug.keystore --ks-pass pass:android --key-pass pass:android --out ./AntigravityWeb.apk /tmp/fast_apk/aligned.apk
          ls -lh ./AntigravityWeb.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityWeb-APK
          path: ./AntigravityWeb.apk

      - name: Publish Direct Download Link on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Antigravity Web Mobile APK v1.0.${{ github.run_number }}"
          body: |
            ### 📱 Direct APK Download
            Click **AntigravityWeb.apk** below under **Assets** to download and install directly on Android.
          files: ./AntigravityWeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
